name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out Goose
        uses: actions/checkout@v4
        with:
          repository: aardappel/goose
          ref: a12523f23e545a6af350562804a0c8b201864946
          path: .ci/goose
          persist-credentials: false
      - name: Build Goose
        run: |
          cmake -S .ci/goose -B .ci/goose/build -DCMAKE_BUILD_TYPE=Debug -DGOOSE_BUILTIN_LIBS=
          cmake --build .ci/goose/build --parallel 2
          echo "$GITHUB_WORKSPACE/.ci/goose/build" >> "$GITHUB_PATH"
      - name: Test TinyCC, GCC and Clang
        run: |
          python3 tests/run.py --cc gcc
          python3 tests/run.py --cc clang
      - name: Run documentation examples
        run: |
          python3 doctest.py --symbols api.txt --preamble tests/doc_preamble.goose --require-examples doc.goose
          for cc in gcc clang; do
            python3 doctest.py --symbols api.txt --preamble tests/doc_preamble.goose --require-examples --cc "$cc" doc.goose
          done
      - name: Check API reference
        run: |
          goose run main.goose -- --title "goose-doc API" --symbols api.txt \
            --require-docs --require-examples --output API.md --check doc.goose
      - name: Generate release reference
        run: |
          goose run main.goose -- --title "goose-doc API" --symbols api.txt \
            --require-docs --require-examples --output "$RUNNER_TEMP/API.md" \
            --source-url "https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA" doc.goose
      - uses: actions/upload-artifact@v4
        with:
          name: api-reference
          path: ${{ runner.temp }}/API.md
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: api-reference
          path: docs
      - name: Publish source release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Expected vMAJOR.MINOR.PATCH"; exit 1; }
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" docs/API.md --clobber
          else
            gh release create "$TAG" docs/API.md --verify-tag --generate-notes
          fi
